[project]
name = "emma"
version = "0.7.0"
description = "Emma is an agent designed to help you interact with Infrahub."
authors = [
    {name = "OpsMill", email = "info@opsmill.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    "streamlit>=1.60.0",
    "infrahub-sdk[all]>=1.22.2,<2.0.0",
    "watchdog>=6.0.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "openai>=2.51.0",
    "langchain-openai>=1.4.1",
    "streamlit-flow-component>=1.6.1",
    "streamlit-sortables>=0.3.1",
    "st-pages>=1.0.1",
    "jinja2>=3.1.6",
    "gitpython>=3.1.57",
    # Imported directly by emma.git_utils and pages/schema_library. Until now it
    # arrived transitively through pandas, which dropped it in pandas 3.
    "pytz>=2026.3",
]

[dependency-groups]
dev = [
    # Capped below 0.16: infrahub-sdk[all] pulls in ariadne-codegen, which pins
    # ruff>=0.15.0,<0.16.0. Raise this once ariadne-codegen allows 0.16.
    "ruff>=0.15.14,<0.16.0",
    "mypy>=2.3.0",
    "yamllint>=1.38.0",
    "towncrier>=25.8.0",
    "pylint>=4.0.6",
    "types-pyyaml>=6.0.12.20260724",
    "invoke>=3.0.3,<4.0.0",
    "types-pytz>=2026.3.1.20260727",
    "pytest>=9.1.1",
]

[tool.uv]
package = true

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "raise NotImplementedError()"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:pkg_resources is deprecated"]
addopts = "-vs"


[tool.mypy]
pretty = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["schema-library"]

[tool.ruff]
line-length = 120
exclude = ["schema-library"]

[tool.ruff.lint]
preview = true

task-tags = ["FIXME", "TODO", "XXX"]

select = [
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "C90",   # mccabe complexity
    "DJ",    # flake8-django
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle errors
    "EXE",   # flake8-executable
    "F",     # pyflakes
    "FURB",  # refurb
    "I",     # isort-like checks
    "ICN",   # flake8-import-conventions
    "INP",   # flake8-no-pep420
    "N",     # pep8-naming
    "PERF",  # Perflint
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PTH",   # flake8-use-pathlib
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "RUF",   # Ruff specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "T10",   # flake8-debugger
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
    "YTT",   # flake8-2020
]

ignore = [
    ##################################################################################################
    # The ignored rules below should be removed once the code has been updated, they are included    #
    # like this so that we can reactivate them one by one. Alternatively ignored after further       #
    # investigation if they are deemed to not make sense.                                            #
    ##################################################################################################
    "missing-type-function-argument", # Missing type annotation for function argument
    "missing-type-args", # Missing type annotation for `*args`
    "missing-type-kwargs", # Missing type annotation for `**kwargs`
    "missing-return-type-undocumented-public-function", # Missing return type annotation for public function
    "missing-return-type-private-function", # Missing return type annotation for private function
    "missing-return-type-special-method", # Missing return type annotation for special method
    "missing-return-type-static-method", # Missing return type annotation for staticmethod
    "missing-return-type-class-method", # Missing return type annotation for classmethod
    "any-type", # Dynamically typed expressions (typing.Any) are disallowed
    "implicit-namespace-package", # Is part of an implicit namespace package
    "unused-loop-control-variable",     # Loop control variable not used within loop body
    "function-call-in-default-argument",     # Do not perform function call `Depends` in argument defaults;
    "get-attr-with-constant",     # [*] Do not call `getattr` with a constant attribute value. It is not any safer than normal property access.
    "set-attr-with-constant",     # [*] Do not call `setattr` with a constant attribute value. It is not any safer than normal property access.
    "raise-without-from-inside-except",     # Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None` to distinguish them from errors in exception handling
    "unnecessary-list-comprehension-set",     # Unnecessary `list` comprehension (rewrite as a `set` comprehension)
    "unnecessary-collection-call",    # Unnecessary `dict` call (rewrite as a literal)
    "unnecessary-literal-within-tuple-call",     # Unnecessary `list` literal passed to `tuple()` (rewrite as a `tuple` literal)
    "unnecessary-double-cast-or-process",     # Unnecessary `list` call within `sorted()`
    "unnecessary-comprehension",     # Unnecessary dict comprehension (rewrite using `dict()`)
    "read-whole-file",  # `open` and `read` should be replaced by `Path(readme_path).read_text(encoding="utf8")`
    "if-exp-instead-of-or-operator", # Replace ternary `if` expression with `or` operator
    "repeated-append", # Use `lines.extend((" " * self.indentation + "}", "}"))` instead of repeatedly calling `lines.append()`
    "implicit-cwd", # Prefer `Path.cwd()` over `Path().resolve()` for current-directory lookups
    "invalid-class-name",     # Class name should use CapWords convention
    "invalid-function-name",     # Function name should be lowercase
    "invalid-first-argument-name-for-method",     # First argument of a method should be named self
    "non-lowercase-variable-in-function",     # Variable in function should be lowercase
    "lowercase-imported-as-non-lowercase",     # Lowercase imported as non-lowercase
    "try-except-in-loop", # `try`-`except` within a loop incurs performance overhead
    "manual-list-comprehension", # Use a list comprehension to create a transformed list
    "too-many-public-methods",  # Too many public methods
    "too-many-branches",  # Too many branches
    "too-many-arguments",  # Too many arguments in function definition
    "too-many-locals",  # Too many local variables
    "too-many-statements",  # Too many statements
    "too-many-boolean-expressions",  # Too many Boolean expressions
    "too-many-positional-arguments",  # Too many positional arguments
    "too-many-nested-blocks",  # Too many nested blocks
    "magic-value-comparison",  # Magic value used in comparison this could possibly be fine in the tests folders
    "literal-membership",  # Use a `set` literal when testing for membership
    "no-self-use",  # Method could be a function, class method, or static method
    "global-statement",  # Using the global statement to update `SETTINGS` is discouraged
    "invalid-envvar-default",  # Invalid type for environment variable default; expected `str` or `None`
    "bad-dunder-method-name",  # Bad or misspelled dunder method name `__init_subclass_with_meta__`
    "os-path-abspath",   # `os.path.abspath()` should be replaced by `Path.resolve()`
    "os-mkdir",   # `os.mkdir()` should be replaced by `Path.mkdir()`
    "os-makedirs",   # `os.makedirs()` should be replaced by `Path.mkdir(parents=True)`
    "os-remove",   # `os.remove()` should be replaced by `Path.unlink()`
    "os-unlink",   # `os.unlink()` should be replaced by `Path.unlink()`
    "os-getcwd",   # `os.getcwd()` should be replaced by `Path.cwd()`
    "os-path-exists",   # `os.path.exists()` should be replaced by `Path.exists()`
    "os-path-isdir",   # `os.path.isdir()` should be replaced by `Path.is_dir()`
    "os-path-isfile",   # `os.path.isfile()` should be replaced by `Path.is_file()`
    "os-path-isabs",   # `os.path.isabs()` should be replaced by `Path.is_absolute()`
    "os-path-join",   # `os.path.join()` should be replaced by `Path` with `/` operator
    "builtin-open",   # `open()` should be replaced by `Path.open()`
    "implicit-return",   # Missing explicit `return` at the end of function able to return non-`None` value
    "unnecessary-assign",  # Unnecessary assignment before `return` statement
    "unnecessary-assign",  # Unnecessary assignment to `data` before `return` statement
    "ambiguous-unicode-character-string",  # String contains ambiguous
    "collection-literal-concatenation",  # Consider `[*path, str(key)]` instead of concatenation
    "unnecessary-iterable-allocation-for-first-element",  # Prefer `next(iter(input_data["variables"].keys()))` over single element slice
    "unused-async",  # Function is declared `async`, but doesn't `await` or use `async` features.
    "hardcoded-temp-file",    # Probable insecure usage of temporary file or directory
    "suspicious-non-cryptographic-random-usage",    # Standard pseudo-random generators are not suitable for cryptographic purposes
    "jinja2-autoescape-false",    # By default, jinja2 sets `autoescape` to `False`. Consider using `autoescape=True`
    "collapsible-if",  # Use a single `if` statement instead of nested `if` statements
    "suppressible-exception",  # Use `contextlib.suppress(KeyError)` instead of `try`-`except`-`pass`
    "if-else-block-instead-of-if-exp",  # Use ternary operator `key_str = f"{value[ALIAS_KEY]}: {key}" if ALIAS_KEY in value and value[ALIAS_KEY] else key` instead of `if`-`else`-block
    "reimplemented-builtin",  # Use `return any(getattr(item, resource_field) == resource_id for item in getattr(self, RESOURCE_MAP[resource_type]))` instead of `for` loop
    "if-with-same-arms",  # Combine `if` branches using logical `or` operator
    "multiple-with-statements",  # Use a single `with` statement with multiple contexts instead of nested `with` statements
    "in-dict-keys",  # Use `key in dict` instead of `key in dict.keys
    "dict-get-with-none-default",  # Use `data.get(key)` instead of `data.get(key, None)`
    "non-pep585-annotation",   # Use `dict` instead of `Dict` for type annotation
    "non-pep604-annotation-union",   # Use X | Y for type annotations
    "unnecessary-encode-utf8",    # Unnecessary call to encode as UTF-8
    "native-literals",    # Unnecessary {literal_type} call (rewrite as a literal)
    "printf-string-formatting",    # Use format specifiers instead of percent format
    "extraneous-parentheses",    # Avoid extraneous parentheses
    "deprecated-import",   # `typing.Dict` is deprecated, use `dict` instead
]


#https://docs.astral.sh/ruff/formatter/black/
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["emma"]

[tool.ruff.lint.pycodestyle]
max-line-length = 150

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["assert", "import-outside-top-level"]  # Allow assert in tests and imports within functions

[tool.pylint.general]
extension-pkg-whitelist = ["pydantic", "ujson"]
ignore = ["schema-library"]

[tool.pylint.format]
disable = "logging-fstring-interpolation"

[tool.pylint.basic]
# No docstrings required for private methods (Pylint default), or for test_ functions.
no-docstring-rgx = "^(_|test_)"

[tool.pylint.messages_control]
# Line length is enforced by Black, so pylint doesn't need to check it.
# Pylint and Black disagree about how to format multi-line arrays; Black wins.
# assigning-non-slot,no-member,unsupported-membership-test,unsubscriptable-object,unsupported-assignment-operation,not-an-iterable
# are disabled because of our move to pydantic 2, pylint does not seem to respect the type hint for pydantic 2 model fields.
disable = """,
    line-too-long,
    missing-module-docstring,
    missing-function-docstring,
    missing-class-docstring,
    consider-using-from-import,
    invalid-name,
    too-many-arguments,
    too-many-locals,
    keyword-arg-before-vararg,
    too-few-public-methods,
    too-many-instance-attributes,
    fixme,
    consider-using-f-string,
    protected-access,
    import-self,
    wrong-import-order,
    assigning-non-slot,
    no-member,
    unsupported-membership-test,
    unsubscriptable-object,
    unsupported-assignment-operation,
    not-an-iterable,
    too-many-return-statements,
    unnecessary-comprehension,
    multiple-statements,
    self-assigning-variable,
    no-else-return,
    """

[tool.pylint.miscellaneous]
notes = """,
    FIXME,
    XXX,
    """

[tool.pylint.similarities]
min-similarity-lines = 20

[tool.towncrier]
package = "emma"
directory = "emma/changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## [{version}](https://github.com/opsmill/emma/tree/{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/opsmill/emma/issues/{issue})"
orphan_prefix = "+"

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emma"]
